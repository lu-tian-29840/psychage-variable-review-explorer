<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HRS PsychAge — selection journey and variable explorer</title>
  <link rel="stylesheet" href="explorer.css">
  <style>
    :root {
      --ink: #17223b;
      --muted: #65708a;
      --line: #dce2ee;
      --paper: #f7f9fc;
      --card: #ffffff;
      --accent: #b34575;
      --accent-dark: #7c2f58;
      --blue: #355a8a;
      --blue-soft: #eaf1fb;
      --petal-a: #c3d8ff;
      --petal-b: #f0c6d9;
      --petal-c: #cfe9db;
      --petal-d: #f6dfac;
      --shadow: 0 14px 38px rgba(40, 55, 90, .09);
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: radial-gradient(circle at 10% 0%, #fff 0, var(--paper) 42%, #f1f4fa 100%); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 1500px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 44px) 42px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent-dark); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 820px; margin-bottom: 8px; font-size: clamp(28px, 4vw, 46px); line-height: 1.03; letter-spacing: -.035em; }
    .lede { max-width: 930px; margin-bottom: 22px; color: var(--muted); font-size: 16px; line-height: 1.55; }
    .notice { padding: 13px 16px; border: 1px solid #ebcfdd; border-radius: 14px; background: #fff8fb; color: #5e2944; font-size: 13px; line-height: 1.5; }
    .topbar { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin: 22px 0 16px; }
    .tabs { display: inline-flex; gap: 6px; padding: 5px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.82); box-shadow: var(--shadow); }
    .tab { border: 0; border-radius: 999px; padding: 9px 17px; background: transparent; color: var(--muted); font-weight: 800; }
    .tab:hover, .tab:focus-visible { color: var(--ink); background: #eef2f8; outline: none; }
    .tab[aria-selected="true"] { background: var(--ink); color: #fff; }
    .audit-strip { padding: 9px 13px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.72); color: var(--muted); font-size: 12px; }
    .grid { display: grid; grid-template-columns: minmax(440px, .92fr) minmax(540px, 1.08fr); gap: 18px; align-items: start; }
    .card { border: 1px solid rgba(220,226,238,.92); border-radius: 20px; background: rgba(255,255,255,.92); box-shadow: var(--shadow); }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 22px 0; }
    .card-head h2 { margin-bottom: 4px; font-size: 20px; letter-spacing: -.02em; }
    .subtle { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .flower-card { overflow: hidden; }
    .flower-stage { position: relative; min-height: 560px; padding: 8px 8px 0; }
    #flower { display: block; width: 100%; height: auto; min-height: 490px; }
    .petal-visible { stroke: rgba(28, 47, 79, .35); stroke-width: 1.4; transition: fill .16s ease, stroke .16s ease, filter .16s ease; }
    .petal-group:hover .petal-visible, .petal-group:focus .petal-visible { stroke: var(--accent-dark); filter: drop-shadow(0 5px 5px rgba(124,47,88,.18)); }
    .petal-group.selected .petal-visible { fill: var(--accent); stroke: var(--accent-dark); stroke-width: 3; }
    .petal-hit { fill: transparent; stroke: transparent; cursor: pointer; }
    .petal-hit:focus { outline: none; }
    .flower-label { fill: var(--ink); font-size: 12px; font-weight: 800; pointer-events: none; }
    .flower-count { fill: var(--muted); font-size: 11px; font-weight: 700; pointer-events: none; }
    .center-button { cursor: pointer; }
    .center-button circle { fill: var(--ink); stroke: #fff; stroke-width: 8; filter: drop-shadow(0 8px 8px rgba(23,34,59,.18)); }
    .center-button text { fill: #fff; text-anchor: middle; pointer-events: none; font-weight: 800; font-size: 14px; }
    .center-button .center-total { font-size: 24px; }
    .flower-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 0 22px 16px; color: var(--muted); font-size: 12px; }
    .legend-dot { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 50%; vertical-align: -1px; }
    .group-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; padding: 0 22px 22px; }
    .group-button { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--ink); text-align: left; font-size: 12px; }
    .group-button:hover, .group-button:focus-visible { border-color: var(--accent); background: #fff7fb; outline: 3px solid rgba(179,69,117,.16); }
    .group-button.selected { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); background: #fff7fb; }
    .group-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group-count { flex: 0 0 auto; color: var(--accent-dark); font-weight: 900; }
    .table-card { overflow: hidden; }
    .controls { display: grid; grid-template-columns: minmax(160px, 1.2fr) repeat(3, minmax(125px, .75fr)); gap: 9px; padding: 16px 22px 10px; }
    .control { min-width: 0; }
    .control label { display: block; margin: 0 0 5px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    .control input, .control select { width: 100%; min-height: 38px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
    .control input:focus, .control select:focus { border-color: var(--accent); outline: 3px solid rgba(179,69,117,.14); }
    .result-meta { display: flex; justify-content: space-between; gap: 12px; padding: 0 22px 12px; color: var(--muted); font-size: 12px; }
    .table-wrap { max-height: 545px; overflow: auto; border-top: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    caption { padding: 10px 22px; color: var(--muted); text-align: left; }
    th { position: sticky; top: 0; z-index: 1; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #f7f9fd; color: var(--muted); text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
    td { padding: 10px 12px; border-bottom: 1px solid #eef1f6; vertical-align: top; }
    tbody tr { cursor: pointer; }
    tbody tr:hover, tbody tr:focus-within { background: #fff8fb; }
    tbody tr.selected { background: #fff1f7; box-shadow: inset 3px 0 0 var(--accent); }
    .id { color: var(--blue); font-weight: 900; white-space: nowrap; }
    .var-label { min-width: 160px; color: var(--ink); font-weight: 700; line-height: 1.35; }
    .group-cell { max-width: 180px; color: var(--muted); line-height: 1.35; }
    .chip { display: inline-block; max-width: 170px; padding: 4px 7px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); font-size: 10px; font-weight: 800; line-height: 1.2; }
    .empty { padding: 35px 22px; color: var(--muted); text-align: center; }
    .detail-card { margin-top: 18px; }
    .detail-inner { display: grid; grid-template-columns: minmax(190px, .72fr) minmax(0, 1.28fr); gap: 22px; padding: 18px 22px 24px; }
    .detail-title { margin-bottom: 4px; color: var(--blue); font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .detail-label { margin-bottom: 5px; font-size: 22px; line-height: 1.12; letter-spacing: -.02em; }
    .detail-note { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; }
    .detail-item { padding-bottom: 10px; border-bottom: 1px solid #edf0f5; }
    .detail-item.full { grid-column: 1 / -1; }
    .detail-key { margin-bottom: 4px; color: var(--muted); font-size: 10px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .detail-value { color: var(--ink); font-size: 13px; line-height: 1.48; overflow-wrap: anywhere; }
    code { padding: 2px 4px; border-radius: 4px; background: #f1f3f8; color: #33405e; font-size: 11px; }
    .footer { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .tooltip { position: fixed; z-index: 5; max-width: 320px; padding: 9px 11px; border: 1px solid #d1d8e7; border-radius: 9px; background: #17223b; color: #fff; box-shadow: var(--shadow); font-size: 12px; line-height: 1.4; pointer-events: none; opacity: 0; transform: translateY(5px); transition: opacity .12s ease, transform .12s ease; }
    .tooltip.show { opacity: 1; transform: translateY(0); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 1060px) {
      .grid { grid-template-columns: 1fr; }
      .flower-stage { min-height: 0; }
      #flower { max-height: 620px; }
      .table-wrap { max-height: 470px; }
    }
    @media (max-width: 650px) {
      .shell { padding: 20px 12px 30px; }
      .card-head { padding-left: 16px; padding-right: 16px; }
      .flower-stage { padding-left: 0; padding-right: 0; }
      #flower { min-height: 390px; }
      .group-list { grid-template-columns: 1fr; padding-left: 16px; padding-right: 16px; }
      .flower-legend { padding-left: 16px; padding-right: 16px; }
      .controls { grid-template-columns: 1fr 1fr; padding-left: 16px; padding-right: 16px; }
      .controls .control:first-child { grid-column: 1 / -1; }
      .result-meta { padding-left: 16px; padding-right: 16px; }
      th, td { padding-left: 9px; padding-right: 9px; }
      .group-cell { display: none; }
      .detail-inner { grid-template-columns: 1fr; padding-left: 16px; padding-right: 16px; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-item.full { grid-column: auto; }
    }
  </style>
</head>
<body>
<main class="shell" id="app"></main>
<script src="variable_flower_data.js"></script>
<script src="journey_data.js"></script>
<script src="explorer.js"></script>
</body>
</html>
